plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.netpractice.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.netpractice.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

chaquopy {
    defaultConfig {
        version = '3.15'
        buildPython 'python'
        pip {
            install 'Flask==3.1.3'
            install 'Werkzeug==3.1.9'
        }
    }
    sourceSets {
        main {
            srcDir "$buildDir/generated/python"
        }
    }
}

def repositoryRoot = rootProject.projectDir.parentFile
def generatedPython = file("$buildDir/generated/python")

tasks.register('syncPythonSources', Copy) {
    from(repositoryRoot) {
        include 'app.py'
        include 'database.py'
        include 'grading.py'
        include 'study.py'
        include 'backup.py'
        include 'packs.py'
        include 'content/**/*.py'
        include 'templates/**/*.html'
        include 'static/**'
    }
    into generatedPython
}

tasks.named('preBuild') {
    dependsOn tasks.named('syncPythonSources')
}

tasks.matching {
    it.name.startsWith('merge') && it.name.endsWith('PythonSources')
}.configureEach {
    dependsOn tasks.named('syncPythonSources')
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}
